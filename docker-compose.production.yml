services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    env_file: [stack.env]

  garage:
    build:
      context: .
      dockerfile: Dockerfile.garage
    pull_policy: never
    restart: always
    volumes:
      - garage_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3903"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    env_file: [stack.env]

  garage-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    pull_policy: never
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - app_secrets:/secrets
    networks:
      - app-network
    env_file: [stack.env]

  setup:
    build:
      context: .
      dockerfile: Dockerfile.migration
    pull_policy: never
    depends_on:
      garage-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - app_secrets:/secrets
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/postgres
    networks:
      - app-network
    env_file: [stack.env]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: $PORT
        POSTGRES_URL: $POSTGRES_URL
        NEXTAUTH_SECRET: $NEXTAUTH_SECRET
        NEXTAUTH_URL: "https://www.thispicthat.com"
        AUTH_GOOGLE_ID: $AUTH_GOOGLE_CLIENT_ID
        AUTH_GOOGLE_SECRET: $AUTH_GOOGLE_CLIENT_SECRET
        MAX_IMAGE_DIMENSION: $MAX_IMAGE_DIMENSION
    pull_policy: never
    ports:
      - "80:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - app_secrets:/secrets
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/postgres
    networks:
      - app-network
    env_file: [stack.env]

volumes:
  pgdata: {}
  garage_data: {}
  app_secrets: {}

networks:
  app-network:
    driver: bridge