version: '3.8'

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  setup:
    build:
      context: .
      target: builder
    command: npm run setup
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - app-network
    env_file:
      - .env

volumes:
  pgdata: {}

networks:
  app-network:
    driver: bridge