name: Deploy to Homelab

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create stack.env
        run: |
          cat <<EOF > stack.env
          # App Secrets
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_TRUST_HOST=${{ secrets.AUTH_TRUST_HOST }}
          AUTH_URL=${{ secrets.AUTH_URL }}
          S3_PUBLIC_ENDPOINT=${{ secrets.S3_PUBLIC_ENDPOINT }}
          PORT=${{ secrets.PORT }}
          AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          MAX_IMAGE_DIMENSION=${{ secrets.MAX_IMAGE_DIMENSION }}
          
          # Database Secrets (Required for db service)
          POSTGRES_URL=${{ secrets.POSTGRES_URL }}
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=postgres
          EOF

      - name: Install Docker Compose
        run: |
          curl -L "https://github.com/docker/compose/releases/download/v5.0.1/docker-compose-$(uname -s)-$(uname -m)" -o docker-compose
          chmod +x docker-compose

      - name: Build Images
        run: docker-compose -f docker-compose.production.yml build

      - name: Run Migrations
        run: docker-compose -f docker-compose.production.yml up setup

      - name: Deploy App
        run: |
          docker-compose -f docker-compose.production.yml up -d --no-deps app
          
          docker-compose -f docker-compose.production.yml exec nginx nginx -s reload

      - name: Prune old images
        run: docker image prune -f